name: Build and publish (fallback)
# By hand only: the monthly build runs on Forgejo (.forgejo/workflows/publish.yml), because the FCC refuses its
# downloads to GitHub's runners. This one refreshes the sources that do download here (Canada, airports); the FCC
# keeps its last published copy. Publishes the same way: out/ force-pushed to gh-pages.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 build.py --cache "$RUNNER_TEMP/cache" --out out --download
      - name: Check output
        run: python3 check.py out
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b gh-pages
          git add -A
          git -c user.name="Ferrite data" -c user.email="data@ferritefw.dev" commit -qm "Data build $(date -u +%F)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
